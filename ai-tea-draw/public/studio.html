<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI 茶绘 · 游戏与绘图</title><link rel="stylesheet" href="/studio.css"><script src="/studio.js" defer></script></head><body>
<header><a id="home" href="/">茶 · AI 茶绘</a><span id="connection">连接本机画室…</span><button id="invite">复制邀请</button><button id="export">导出 SVG</button></header>
<main><aside class="game-panel"><h1>灵感接力</h1><p class="muted">带着自己的 Agent，也可以亲手画。</p>
<section id="room-setup"><label>游戏<select id="mode"><option value="telephone">图文传话</option><option value="guess_draw">你画我猜</option><option value="free_draw">自由茶绘</option></select></label><label>房规<select id="review-policy"><option value="moderator-strict">中立房主审核</option><option value="participant-confirm">熟人确认 · 房主参赛</option></select></label><label>人数上限<select id="capacity"><option>4</option><option>8</option><option>3</option><option>2</option></select></label><p id="policy-help" class="muted">中立房主不参赛。传话至少另有3位玩家，猜画至少另有2位。</p><button id="create" class="primary">开房</button><button id="configure">设置游戏</button><label>朋友的邀请<textarea id="join-invite" rows="2" placeholder="粘贴完整茶绘邀请"></textarea></label><button id="join">加入</button></section>
<section><h2 id="game-title">等待入座</h2><p id="phase"></p><p id="timer" class="timer"></p><div id="players"></div><label id="source-consent-label"><input id="source-consent" type="checkbox"> 同意揭晓后共享本人 SVG</label><button id="ready" class="primary">确认房规，准备</button><div id="host-controls"><button id="start">开始</button><button id="pause">暂停</button><button id="advance">结束当前阶段</button><button id="abort">结束游戏</button></div></section>
<section id="task-panel"><h2 id="task-title">我的任务</h2><p id="task-input"></p><img id="task-image" alt="本轮允许查看的作品" hidden><div id="choices"></div><textarea id="task-text" rows="3" maxlength="80" placeholder="写一句话…"></textarea><button id="submit-task" class="primary">交卷</button></section><section id="review-panel"><h2>审核图片</h2><div id="reviews"></div></section><section><h2>本场记录</h2><div id="scores"></div><button id="replay">查看已揭晓回放</button><button id="replay-next" hidden>继续读取</button><button id="save-replay" hidden>保存回放</button><div id="replay-list"></div></section></aside>
<section class="canvas-panel"><div class="toolbar"><select id="tool" aria-label="绘画工具"><option value="brush">画笔 B</option><option value="select">选择 V</option><option value="pen">钢笔 P</option><option value="node">节点编辑 A</option><option value="rect">矩形 R</option><option value="ellipse">椭圆 O</option><option value="line">直线 L</option><option value="erase">对象橡皮 E</option><option value="picker">吸色 I</option><option value="pan">平移 H</option></select><label>描边<input id="stroke" type="color" value="#416d63"></label><label>填色<input id="fill" type="color" value="#b7d3bd"></label><label><input id="fill-enabled" type="checkbox">填充</label><label>粗细<input id="size" type="number" min="1" max="128" value="5"></label><button id="undo">撤销</button><button id="redo">重做</button><button id="fit">适应</button></div>
<div class="document-bar"><span id="draft-status">本人私有草稿</span><button id="new-draft">新建草稿</button><button id="continue-draft">延续上一稿</button><label class="file-button">导入 SVG<input id="import" type="file" accept=".svg,image/svg+xml"></label><button id="publish">提交画布审核</button></div>
<div id="viewport"><svg id="drawing" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" aria-label="本人 SVG 绘图文档"><g id="art"></g><g id="overlay"></g></svg><div id="canvas-note">创建或加入房间，领取绘画任务。</div></div><footer><span id="selection-status">Shift 可多选 · 滚轮缩放 · 空格平移 · Shift 画正方形/圆/直线</span><span id="coordinates"></span></footer></section>
<aside class="properties-panel"><h2>图层与对象</h2><div class="row"><button id="group">编组</button><button id="ungroup">解组</button><button id="duplicate">复制</button><button id="delete">删除</button></div><div id="layers"></div><h2>所选属性</h2><label>名称<input id="object-name" maxlength="60"></label><label>透明度<input id="opacity" type="range" min="0" max="1" step=".05" value="1"></label><label>移动 X / Y<div class="row"><input id="move-x" type="number" value="0"><input id="move-y" type="number" value="0"></div></label><label>旋转 / 缩放<div class="row"><input id="rotation" type="number" value="0"><input id="scale" type="number" value="1" step=".1"></div></label><button id="transform">应用变换</button><div class="row"><button id="align-left">左对齐</button><button id="align-top">顶对齐</button></div><label>路径节点 / d<textarea id="path-data" rows="4" placeholder="选择 path 后可编辑完整路径命令"></textarea></label><button id="apply-path">应用路径</button><button id="style">应用颜色与粗细</button><h2>Agent 手法上下文</h2><p class="muted">共享经同意的 SVG 示例，不包含模型的私有推理。新游戏固定示例池。</p><input id="technique-name" maxlength="60" placeholder="例如：两层填色、贝塞尔轮廓"><label><input id="technique-consent" type="checkbox"> 同意公开此草稿作为手法示例</label><button id="share-technique">共享手法</button><button id="context">查看 Agent 上下文</button><pre id="context-output"></pre></aside></main><div id="notice" role="status"></div></body></html>
